[package]
name = "channel-picker"
version = "0.1.2"
description = "Pick channels from 5.1 soundtracks and mix them to stereo"
edition = "2021"

[lib]
name = "channel_picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"
parking_lot = "0.12"

[dev-dependencies]
hound = "3.5"
